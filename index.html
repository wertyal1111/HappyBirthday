<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С Днём Рождения!</title>
<style>
    body {
        margin: 0;
        font-family: 'Arial', sans-serif;
        background: linear-gradient(270deg, #ff9a9e, #fad0c4);
        background-size: 400% 400%;
        animation: gradientBG 10s ease infinite;
        overflow: hidden;
        text-align: center;
        color: white;
    }

    @keyframes gradientBG {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    h1 {
        margin-top: 50px;
        font-size: 50px;
        animation: fadeIn 2s ease-in-out;
    }

    h2 {
        font-size: 30px;
        animation: fadeIn 3s ease-in-out;
    }

    p {
        font-size: 20px;
        width: 80%;
        margin: auto;
        animation: fadeIn 4s ease-in-out;
    }

    @keyframes fadeIn {
        from {opacity: 0;}
        to {opacity: 1;}
    }

    .cake {
        width: 200px;
        margin-top: 30px;
        animation: bounce 2s infinite;
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }

    .balloon {
        position: absolute;
        bottom: -150px;
        width: 80px;
        animation: float 10s infinite;
    }

    @keyframes float {
        0% {transform: translateY(0);}
        100% {transform: translateY(-120vh);}
    }

    button {
        margin-top: 30px;
        padding: 15px 25px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: #ff6f61;
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #ff3b2e;
    }
</style>
</head>

<body>

<h1>🎉 С ДНЁМ РОЖДЕНИЯ! 🎉</h1>
<h2>Любимой двоюродной сестре 💖</h2>

<img class="cake" src="https://cdn-icons-png.flaticon.com/512/3468/3468371.png">

<p>
Поздравляю тебя с 15-летием! 🥳<br><br>
Пусть твоя жизнь будет яркой, как этот праздник 🎈<br>
Пусть сбываются мечты ✨ и каждый день приносит радость 💕<br><br>
Ты самая лучшая сестра! ❤️
</p>

<button onclick="showMessage()">Нажми сюда 🎁</button>

<!-- Шарики -->
<img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png" style="left:10%; animation-delay:0s;">
<img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png" style="left:40%; animation-delay:3s;">
<img class="balloon" src="https://cdn-icons-png.flaticon.com/512/3468/3468377.png" style="left:70%; animation-delay:6s;">

<script>
function showMessage() {
    alert("🎂 С 15-летием! Пусть все мечты сбудутся! 💖");
}
</script>

</body>
</html>
